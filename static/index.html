<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR распознавание текста</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .upload-area {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        .upload-area.drag-over {
            background: #f0f0ff;
            border: 2px dashed #667eea;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .upload-text {
            color: #666;
            font-size: 1.1rem;
        }

        .upload-input {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
            display: inline-block;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .main-content {
            display: flex;
            gap: 20px;
            min-height: 600px;
        }

        .image-section {
            flex: 2;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .image-section h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            text-align: center;
        }

        .image-canvas {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        .transcriptions-section {
            flex: 1;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            max-height: 80vh;
            overflow-y: auto;
        }

        .transcriptions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .transcriptions-header h2 {
            color: #333;
            margin: 0;
        }

        .transcriptions-list {
            flex: 1;
            overflow-y: auto;
        }

        .transcription-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.2s;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .transcription-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .transcription-item.selected {
            border-color: #667eea;
            background: #f0f0ff;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .transcription-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: #667eea;
            font-weight: bold;
        }

        .transcription-text {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
        }

        .transcription-text:focus {
            outline: none;
            border-color: #667eea;
        }

        .confidence {
            font-size: 0.85rem;
            color: #28a745;
        }

        .merged-badge {
            font-size: 0.75rem;
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 10px;
        }

        .validated-badge {
            font-size: 0.75rem;
            background: #28a745;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 5px;
        }

        .save-btn {
            background: #28a745;
            margin-top: 0;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .info-text {
            text-align: center;
            color: #999;
            margin-top: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📝 OCR Распознавание текста</h1>
        <p>YOLOv11 + TrOCR</p>
    </div>

    <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📸</div>
        <div class="upload-text">
            <strong>Нажмите или перетащите изображение</strong><br>
            Поддерживаются форматы: JPG, PNG, JPEG
        </div>
        <input type="file" id="fileInput" class="upload-input" accept="image/*">
        <button class="btn" onclick="document.getElementById('fileInput').click()">Выбрать файл</button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 10px;">Обработка изображения... Это может занять несколько секунд</p>
    </div>

    <div class="main-content" id="mainContent" style="display: none;">
        <div class="image-section">
            <h2>🖼️ Изображение с разметкой</h2>
            <div class="canvas-wrapper">
                <canvas id="imageCanvas" class="image-canvas"></canvas>
            </div>
            <div class="info-text">💡 Кликните на прямоугольник, чтобы выбрать блок для редактирования</div>
        </div>

        <div class="transcriptions-section">
            <div class="transcriptions-header">
                <h2>📋 Распознанный текст</h2>
                <button class="btn save-btn" id="saveBtn" onclick="saveTranscriptions()">💾 Сохранить</button>
            </div>
            <div id="transcriptionsList" class="transcriptions-list"></div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    let currentImage = null;
    let currentDetections = [];
    let currentFilename = null;
    let canvas = null;
    let ctx = null;
    let scale = 1;
    let selectedIndex = -1;

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const loading = document.getElementById('loading');
    const mainContent = document.getElementById('mainContent');
    const imageCanvas = document.getElementById('imageCanvas');
    canvas = imageCanvas;
    ctx = canvas.getContext('2d');

    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('drag-over');
    });

    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('drag-over');
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
            handleFile(file);
        }
    });

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            handleFile(file);
        }
    });

    async function handleFile(file) {
        const formData = new FormData();
        formData.append('file', file);

        loading.style.display = 'block';
        mainContent.style.display = 'none';
        selectedIndex = -1;

        try {
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            currentFilename = data.filename;
            currentDetections = data.detections;

            const img = new Image();
            img.onload = () => {
                drawImageWithBoxes(img, data.detections);
                displayTranscriptions(data.detections);
                mainContent.style.display = 'flex';
                loading.style.display = 'none';
            };
            img.src = data.url;
            currentImage = img;

            const emptyCount = data.detections.filter(d => !d.text || d.text.trim() === '').length;
            if (emptyCount > 0) {
                showToast(`⚠️ ${emptyCount} блоков были удалены (пустой текст после валидации)`, 'warning');
            } else {
                showToast('✅ Изображение успешно обработано!', 'success');
            }
        } catch (error) {
            console.error('Ошибка:', error);
            showToast('❌ Ошибка при обработке изображения', 'error');
            loading.style.display = 'none';
        }
    }

    function drawImageWithBoxes(img, detections) {
        const maxWidth = 800;
        scale = Math.min(maxWidth / img.width, 1);
        const width = img.width * scale;
        const height = img.height * scale;

        canvas.width = width;
        canvas.height = height;

        ctx.drawImage(img, 0, 0, width, height);

        detections.forEach((detection, index) => {
            const [x, y, w, h] = detection.bbox;
            const scaledX = (x - w / 2) * scale;
            const scaledY = (y - h / 2) * scale;
            const scaledW = w * scale;
            const scaledH = h * scale;

            if (index === selectedIndex) {
                ctx.strokeStyle = '#ff4444';
                ctx.lineWidth = 3;
            } else {
                ctx.strokeStyle = detection.is_merged ? '#28a745' : '#667eea';
                ctx.lineWidth = 2;
            }
            ctx.strokeRect(scaledX, scaledY, scaledW, scaledH);

            ctx.fillStyle = index === selectedIndex ? '#ff4444' : (detection.is_merged ? '#28a745' : '#667eea');
            ctx.font = 'bold 12px Arial';
            ctx.fillText(`#${index + 1}`, scaledX + 5, scaledY + 20);
        });
    }

    function displayTranscriptions(detections) {
        const container = document.getElementById('transcriptionsList');
        container.innerHTML = '';

        detections.forEach((detection, index) => {
            const item = document.createElement('div');
            item.className = 'transcription-item';
            if (index === selectedIndex) {
                item.classList.add('selected');
            }
            item.id = `transcription-${index}`;
            item.onclick = () => selectTranscription(index);

            const confidencePercent = detection.confidence ? (detection.confidence * 100).toFixed(1) : 'N/A';
            const mergedBadge = detection.is_merged ? '<span class="merged-badge">📎 строка</span>' : '';
            const validatedBadge = detection.was_validated ? '<span class="validated-badge">✓ валидирован</span>' : '';

            item.innerHTML = `
                        <div class="transcription-header">
                            <span>📦 Блок #${index + 1} ${mergedBadge} ${validatedBadge}</span>
                            <span class="confidence">Уверенность: ${confidencePercent}%</span>
                        </div>
                        <textarea
                            class="transcription-text"
                            id="text-${index}"
                            data-original="${escapeHtml(detection.text)}"
                            rows="3"
                            onchange="updateText(${index})"
                        >${escapeHtml(detection.text)}</textarea>
                    `;

            container.appendChild(item);
        });
    }

    function selectTranscription(index) {
        selectedIndex = index;

        document.querySelectorAll('.transcription-item').forEach((item, i) => {
            if (i === index) {
                item.classList.add('selected');
            } else {
                item.classList.remove('selected');
            }
        });

        if (currentImage) {
            drawImageWithBoxes(currentImage, currentDetections);
        }

        const selectedElement = document.getElementById(`transcription-${index}`);
        if (selectedElement) {
            selectedElement.scrollIntoView({behavior: 'smooth', block: 'center'});
        }
    }

    function updateText(index) {
        const textarea = document.getElementById(`text-${index}`);
        if (textarea) {
            currentDetections[index].text = textarea.value;
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    async function saveTranscriptions() {
        const transcriptions = [];

        currentDetections.forEach((detection, index) => {
            const textarea = document.getElementById(`text-${index}`);
            if (textarea) {
                const currentText = textarea.value;
                const originalText = textarea.dataset.original || '';

                transcriptions.push({
                    bbox: detection.bbox,
                    text: currentText,
                    original: originalText,
                    confidence: detection.confidence,
                    edited: currentText !== originalText,
                    order: index + 1,
                    is_merged: detection.is_merged || false,
                    was_validated: detection.was_validated || false
                });
            }
        });

        const data = {
            filename: currentFilename,
            image_name: currentFilename,
            transcriptions: transcriptions
        };

        try {
            const response = await fetch('/save', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            if (result.success) {
                showToast(`✅ Транскрипции сохранены в файл: ${result.file}`, 'success');
                setTimeout(() => {
                    window.open(`/download/${result.file}`, '_blank');
                }, 1000);
            }
        } catch (error) {
            console.error('Ошибка сохранения:', error);
            showToast('❌ Ошибка при сохранении', 'error');
        }
    }

    function showToast(message, type) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.display = 'block';
        toast.style.backgroundColor = type === 'success' ? '#28a745' : (type === 'warning' ? '#ff9800' : '#dc3545');

        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }

    canvas.addEventListener('click', (e) => {
        if (!currentDetections.length) return;

        const rect = canvas.getBoundingClientRect();
        const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
        const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

        let closestIndex = -1;

        currentDetections.forEach((detection, index) => {
            const [x, y, w, h] = detection.bbox;
            const scaledX = (x - w / 2) * scale;
            const scaledY = (y - h / 2) * scale;
            const scaledW = w * scale;
            const scaledH = h * scale;

            if (clickX >= scaledX && clickX <= scaledX + scaledW &&
                clickY >= scaledY && clickY <= scaledY + scaledH) {
                closestIndex = index;
            }
        });

        if (closestIndex !== -1) {
            selectTranscription(closestIndex);
        }
    });

    console.log('Приложение загружено');
</script>
</body>
</html>
